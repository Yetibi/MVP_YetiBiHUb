<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  .og{
    width:1200px;height:630px;box-sizing:border-box;
    background:#0B1420;
    background-image:radial-gradient(ellipse 60% 55% at 50% 40%, rgba(79,209,224,.10), rgba(11,20,32,0) 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Space Grotesk',Arial,Helvetica,sans-serif;
    position:relative;overflow:hidden;
  }
  .sym{width:400px;height:auto;margin-bottom:40px}
  .word{font-weight:700;font-size:112px;line-height:1;letter-spacing:2px;margin:0}
  .word .y{color:#F2F6F9}
  .word .dot{color:#4FD1E0}
  .word .bi{color:#E07B30}
  .tag{margin:34px 0 0 0;font-weight:500;font-size:33px;letter-spacing:.4px;color:#8B95A5}
  .edge{position:absolute;left:0;right:0;bottom:0;height:6px;background:#E07B30}
</style>
</head>
<body>
<div class="og">
  <svg class="sym" viewBox="19 73 164 54" xmlns="http://www.w3.org/2000/svg">
    <path d="M24 100 C30 68 40 78 47 100" fill="none" stroke="#8B95A5" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M47 100 C51 126 60 114 65 100" fill="none" stroke="#8B95A5" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M65 100 C69 86 75 94 80 100 C83 103 85 98 88 100" fill="none" stroke="#8B95A5" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="24" cy="100" r="3.6" fill="#E07B30"/>
    <circle cx="47" cy="100" r="3" fill="#E07B30"/>
    <circle cx="65" cy="100" r="2.4" fill="#E07B30"/>
    <circle cx="98.5" cy="76" r="1.9" fill="#F2F6F9"/>
    <circle cx="98.5" cy="88" r="2.65" fill="#F2F6F9"/>
    <circle cx="98.5" cy="100" r="3.4" fill="#F2F6F9"/>
    <circle cx="98.5" cy="112" r="2.65" fill="#F2F6F9"/>
    <circle cx="98.5" cy="124" r="1.9" fill="#F2F6F9"/>
    <path d="M112 76 L134 100 L112 124" fill="none" stroke="#4FD1E0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="134" y1="100" x2="160" y2="100" stroke="#4FD1E0" stroke-width="3" stroke-linecap="round"/>
    <line x1="168" y1="100" x2="180" y2="100" stroke="#E07B30" stroke-width="4.5" stroke-linecap="round"/>
  </svg>
  <p class="word"><span class="y">YETI</span><span class="dot">·</span><span class="bi">BI</span></p>
  <p class="tag">Primero el proceso, después la IA.</p>
  <div class="edge"></div>
</div>
</body>
</html>
